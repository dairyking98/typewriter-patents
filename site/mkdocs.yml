# Static site for this repo (generated; don't edit here).
# The pages live at the repo root, so site/build.sh copies them into _docs/ first (MkDocs can't use its own folder).
site_name: "Typewriters & Patents"
site_url: https://leonardchau.com/typewriters-patents/
site_description: "An open library of typewriter history: 10,201 patents (US 1829–1951, Germany 1877–1950) with drawings and plain-English summaries, 1,045 machines with makers, prices and features, an interactive timeline by country and kind, and guides to index, type-element and typebar typewriters."
repo_url: https://github.com/dairyking98/typewriters-patents
edit_uri: ""
docs_dir: ../_docs
site_dir: ../_site
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/brightness-4, name: Light mode}
plugins:
  - search
  - tags
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
extra_css:
  - extra.css
  - assets/timeline.css
extra_javascript:
  - assets/timeline.js
validation:
  nav:
    omitted_files: ignore
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: ignore
nav:
  - Home: README.md
  - Timelines:
      - timelines/README.md
      - The American typewriter: views/american-timeline.md
      - The master timeline: guides/master-timeline.md
      - Typewriter features through time: views/typewriter-features.md
      - Timeline browser: explore/timeline.md
      - Decade by decade: views/timeline.md
  - Guides:
      - guides/README.md
      - Typebar typewriters: guides/typebar-typewriters.md
      - Type-element typewriters: guides/type-element-typewriters.md
      - Index typewriters:
          - What is an index typewriter?: guides/index-typewriters.md
          - How index machines work: guides/how-index-machines-work.md
          - Index-machine features: guides/timeline-of-features.md
          - German index typewriters: guides/german-index-typewriters.md
  - Machines & mechanisms:
      - views/README.md
      - Index machines: views/index-machines.md
      - Mechanisms: views/mechanisms.md
      - Inventors: views/inventors.md
      - By subsystem:
          - Selection: views/sel.md
          - Type element: views/elem.md
          - Typebars: views/bar.md
          - Shift: views/shift.md
          - Impression: views/imp.md
          - Inking: views/ink.md
          - Escapement and spacing: views/esc.md
          - Paper and carriage: views/pap.md
          - Frame: views/frm.md
          - Uses: views/use.md
  - Browse:
      - browse/README.md
      - Machines: machines/README.md
      - Patents: patents/README.md
      - Mechanism features: features/README.md
      - People: people/README.md
      - Companies: companies/README.md
      - Patent families: families/README.md
      - Tags: tags.md
  - About:
      - about/README.md
      - Sources and credits: about/sources.md
